services:
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"

  api:
    build: .
    ports:
      - "8888:8888"
    environment:
      port: 8888
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/plain_posting_program
    depends_on:
      - mongo